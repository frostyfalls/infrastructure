name: ansible-lint
on: [push]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: docker.io/alpine:3.24
    steps:
      - name: Install ansible-lint
        run: apk add --no-cache ansible-lint
      - name: Run ansible-lint
        run: ansible-lint
