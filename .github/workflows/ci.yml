---
name: CI
on:
  - push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    container:
      image: docker.io/alpine:3.24
    steps:
      - uses: actions/checkout@v7
      - run: apk add --no-cache ansible-lint
      - run: ansible-lint
