---
- name: Create unattended-updates script
  ansible.builtin.copy:
    src: unattended-updates.sh
    dest: /usr/local/scripts/unattended-updates.sh
    owner: root
    group: root
    mode: '0755'
  notify:
    - Restart cronie service
- name: Install 10-unattended-updates crontab
  ansible.builtin.copy:
    src: 10-unattended-updates
    dest: /etc/cron.d/10-unattended-updates
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart cronie service
