---
- name: Install nftables
  community.general.xbps:
    name:
      - nftables
      - runit-nftables

- name: Create nftables rules directories
  ansible.builtin.file:
    path: /etc/nftables/{{ item }}
    owner: root
    group: root
    mode: '0755'
    state: directory
  with_items:
    - inbound-rules.d
    - forward-rules.d
  loop_control:
    label: /etc/nftables/{{ item }}

- name: Create /etc/nftables.conf
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Apply firewall rules

- name: Create nftables inbound rules
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: /etc/nftables/inbound-rules.d/{{ item }}
    owner: root
    group: root
    mode: '0644'
  notify:
    - Apply firewall rules
  with_items:
    - 10-inbound-base.conf
    - 20-inbound-ssh.conf
  loop_control:
    label: /etc/nftables/inbound-rules.d/{{ item }}

- name: Create nftables forward rules
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: /etc/nftables/forward-rules.d/{{ item }}
    owner: root
    group: root
    mode: '0644'
  notify:
    - Apply firewall rules
  with_items:
    - 10-forward-base.conf
  loop_control:
    label: /etc/nftables/forward-rules.d/{{ item }}
