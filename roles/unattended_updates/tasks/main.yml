---
- name: Create unattended-updates.sh script
  ansible.builtin.template:
    src: unattended-updates.sh.j2
    dest: '{{ usr_local_scripts_directory }}/unattended-updates.sh'
    owner: root
    group: root
    mode: '0755'

- name: Create unattended-updates crontab
  ansible.builtin.cron:
    name: unattended-updates
    minute: 30
    hour: '01'
    user: root
    cron_file: 01-unattended-updates
    job: '{{ usr_local_scripts_directory }}/unattended-updates.sh'
